<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- ristoview app icon: the monthly gift. Full bleed and opaque, so iOS never adds its own black or white fill. -->
  <defs>
    <!-- one stripe pattern anchored to the canvas, so lid and box stripes line up -->
    <pattern id="stripes" width="100" height="100" patternUnits="userSpaceOnUse" x="12">
      <rect width="100" height="100" fill="#fffafb"/>
      <rect width="50" height="100" fill="#f4a7be"/>
    </pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.7" stop-color="#8f1745" stop-opacity="0"/>
      <stop offset="1" stop-color="#8f1745" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f1745" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8f1745" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="#fdeef2"/>
  <g transform="translate(512 548) scale(1.14) translate(-512 -560)">
  <ellipse cx="512" cy="862" rx="300" ry="44" fill="url(#floor)"/>

  <!-- box -->
  <rect x="262" y="468" width="500" height="382" rx="40" fill="url(#stripes)"/>
  <rect x="262" y="468" width="500" height="382" rx="40" fill="url(#shade)"/>
  <rect x="262" y="468" width="500" height="40" fill="#8f1745" opacity="0.16"/>
  <rect x="262" y="612" width="500" height="74" fill="#b8235a"/>
  <rect x="472" y="468" width="80" height="382" fill="#b8235a"/>

  <!-- lid -->
  <rect x="228" y="378" width="568" height="112" rx="32" fill="url(#stripes)"/>
  <rect x="228" y="378" width="568" height="112" rx="32" fill="url(#shade)"/>
  <rect x="472" y="378" width="80" height="112" fill="#b8235a"/>

  <!-- bow -->
  <path d="M500 372 C440 250 300 240 312 318 C322 382 430 384 500 380 Z" fill="#b8235a"/>
  <path d="M524 372 C584 250 724 240 712 318 C702 382 594 384 524 380 Z" fill="#b8235a"/>
  <path d="M488 362 C450 296 372 290 376 322 C380 348 440 356 488 360 Z" fill="#8f1745"/>
  <path d="M536 362 C574 296 652 290 648 322 C644 348 584 356 536 360 Z" fill="#8f1745"/>
  <rect x="478" y="320" width="68" height="70" rx="24" fill="#8f1745"/>

  <!-- gold seal -->
  <circle cx="512" cy="649" r="86" fill="#c9a15a"/>
  <circle cx="512" cy="649" r="86" fill="none" stroke="#8a6424" stroke-width="6"/>
  <circle cx="512" cy="649" r="64" fill="none" stroke="#8a6424" stroke-width="4" stroke-dasharray="8 10"/>
  </g>
</svg>
